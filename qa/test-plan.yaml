# ---------------------------------------------------------------------------
# FUZZ FAMILIES (≥5 required — constitution §NEGATIVE+FUZZ ARE NOT OPTIONAL)
# ---------------------------------------------------------------------------

fuzz_families:

  - id: FUZZ-LONG-INPUT
    desc: "Oversized inputs in onboarding form fields"
    inject:
      firm_name: "A" * 500
      firm_aliases: ["alias" + str(i) for i in range(100)]
      ingredient_categories: ["protein"] * 200
      channel_destination: "http://webhook.example.com/" + "x" * 2000
    expect: "API returns 400 or 422 with validation error; no DB insert; no 500"
    sources:
      - "app/api/onboard/route.ts (input validation)"
      - "runbook §13 general input hygiene"

  - id: FUZZ-UNICODE-RTL
    desc: "Unicode, RTL, emoji, and control characters in firm name and channel fields"
    inject:
      firm_name: "شركة المكملات الغذائية"
      firm_aliases: ["מגה-הלת", "🏭 Mega Health™"]
      channel_destination: "https://hooks.slack.com/services/​/​INVALID"
    expect: "Inputs stored or rejected cleanly; no garbled DB row; no XSS reflected; delivery attempted to sanitized URL only"
    sources:
      - "app/api/onboard/route.ts"
      - "lib/delivery/slack.ts"

  - id: FUZZ-RACE-ONBOARD
    desc: "Two concurrent POST /api/onboard requests for the same session_id"
    inject:
      concurrent_requests: 2
      same_session_id: true
    expect: "Exactly one customers row created; no duplicate customer_channels; second request returns 200 {already_onboarded: true} or 409; no 500"
    sources:
      - "app/api/onboard/route.ts"
      - "lib/customers.ts:finalizeOnboarding"

  - id: FUZZ-OAUTH-STATE
    desc: "Slack OAuth callback with forged or replayed state cookie"
    inject:
      state_variations:
        - forged_hmac: "state_cookie with invalid HMAC signature"
        - replayed: "valid state cookie used a second time after successful OAuth"
        - missing: "no state cookie at all"
        - mismatched_session: "state cookie bound to different session_id"
    expect: "All four variations return 400; no channel row inserted; no 500"
    sources:
      - "app/api/slack/oauth/callback/route.ts"
      - "lib/slack-oauth.ts (HMAC state verification)"
      - "runbook §13.3"

  - id: FUZZ-CHANNEL-MID-DELIVERY
    desc: "Channel deleted while deliver cron is mid-run processing its jobs"
    inject:
      setup: "10 pending delivery_jobs for a channel"
      race: "DELETE /api/account/channels/<id> while /api/cron/deliver is running"
    expect: "Delivery cron handles missing channel gracefully; delivery_jobs marked failed (not stuck pending); no 500; no data corruption"
    sources:
      - "app/api/cron/deliver/route.ts"
      - "app/api/account/channels/route.ts (DELETE)"

  - id: FUZZ-WEBHOOK-REPLAY
    desc: "Same Stripe webhook event delivered twice (Stripe retry behavior)"
    inject:
      event_id: "evt_test_duplicate"
      delivered_count: 2
    expect: "subscription_events count = 1 after both deliveries; idempotency key prevents duplicate row; second handler returns 200 (not error)"
    sources:
      - "app/api/stripe/webhook/route.ts"

