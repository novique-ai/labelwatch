# ---------------------------------------------------------------------------
# COVERAGE GAPS (human governor must triage before first qa-run)
# ---------------------------------------------------------------------------

coverage_gaps:

  - source: "TIERS[1].features[0] — 'All verticals, all channels' (Pro)"
    reason: "Only supplements vertical exists in production (openFDA food enforcement only). No USDA FSIS / CPSC / NHTSA verticals shipped. The claim is aspirational."
    recommended_action: "Remove claim OR mark test blocked_on until RecallWatch family epic (infrastructure-he84) ships"

  - source: "TIERS[2].features[3] — 'Priority support' (Team)"
    reason: "No support ticketing system, SLA tracking, or dedicated support routing exists. Claim is marketing-only with no technical backing."
    recommended_action: "Remove claim from Team tier features until support infrastructure defined; no test case emittable"

  - source: "app/page.tsx#L566 — 'within 15 minutes of FDA publication'"
    reason: "Cannot be tested without a real live FDA publication event. Synthetic recall injection tests the delivery pipeline but not the publication-to-poll latency. UptimeRobot pings poller every 15min but this only bounds polling cadence, not end-to-end latency."
    recommended_action: "Add monitoring alert for poller_runs.last_run lag > 20min; accept synthetic test as proxy for delivery pipeline; document this gap in SLA"

  - source: "TIERS[1].features[0] — 'All channels' (Pro) — Teams channel"
    reason: "Microsoft Teams OAuth flow not yet implemented (runbook §13.3 deferred Teams to MVP1+). customer_channels type='teams' may not be accepted."
    recommended_action: "Mark TC-CHANMGMT-TEAMS as blocked_on: teams_oauth_not_shipped; test Slack/email/HTTP only for now"

  - source: "Stripe Customer Portal — tier downgrade flow"
    reason: "Tier downgrade (Team → Pro → Starter) not tested. subscription_events handler for customer.subscription.updated with plan change not verified. Customer's tier field in customers table may not update on downgrade."
    recommended_action: "Add TC-BILLING-003 in next refresh once subscription.updated handler is confirmed"
