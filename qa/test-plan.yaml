# ---------------------------------------------------------------------------
# VARIANT AXES
# These are fan-out dimensions; test_cases use cross_product_with: to expand.
# ---------------------------------------------------------------------------

variants:
  persona:
    - id: P-SUPPLEMENT-OP
      desc: "Supplement brand operator — non-technical, Shopify-tier seller, first-time subscriber"
    - id: P-COMPLIANCE-MGR
      desc: "Compliance manager — technical, Pro tier, managing multi-brand portfolio"
    - id: P-AGENCY-ADMIN
      desc: "Agency admin — Team tier, managing org with multiple seats"
    - id: P-RETURNING
      desc: "Returning customer — already onboarded, no active session cookie"
    - id: P-FAILED-PAYMENT
      desc: "Customer whose payment method was declined after trial"

  payment:
    - id: PAY-SUCCESS
      card: "4242 4242 4242 4242"
      outcome: success
    - id: PAY-INSUFFICIENT
      card: "4000 0000 0000 9995"
      outcome: card_declined
    - id: PAY-EXPIRED
      card: "4000 0000 0000 0069"
      outcome: expired_card
    - id: PAY-3DS
      card: "4000 0027 6000 3184"
      outcome: requires_action
    - id: PAY-DECLINE
      card: "4000 0000 0000 0002"
      outcome: generic_decline

  tier:
    - id: T-STARTER
      stripe_price_env: STRIPE_PRICE_STARTER
      price: "$39/mo"
      expected_acceptance: true
    - id: T-PRO
      stripe_price_env: STRIPE_PRICE_PRO
      price: "$99/mo"
      expected_acceptance: true
    - id: T-TEAM
      stripe_price_env: STRIPE_PRICE_TEAM
      price: "$299/mo"
      expected_acceptance: true

# ---------------------------------------------------------------------------
# STAGES — maps to customer-journey doctrine §13 + §14
# ---------------------------------------------------------------------------

stages:
  - id: marketing
    desc: "Homepage renders, all claims visible, recall strip live (pre-checkout)"
  - id: checkout
    desc: "Stripe Checkout session creation → payment → redirect (§13.5, §13.6)"
  - id: webhook
    desc: "Stripe webhook delivery → subscription_events table (§13.6)"
  - id: onboarding
    desc: "POST /api/onboard: firm, channels, severity — cookie set (§13.2, §13.3, §13.4)"
  - id: account
    desc: "/account dashboard: subscription, scope, channels, recent matches (§13.1, §13.9)"
  - id: delivery
    desc: "matcher cron → delivery_jobs → channel delivery email/Slack/HTTP (§13.2)"
  - id: channel_mgmt
    desc: "Add/remove channels from /account (§14.1)"
  - id: history
    desc: "Delivery history visible in /account, window cap enforced by tier"
  - id: digest
    desc: "Daily digest cron for Starter (9am UTC Vercel cron, xzuz)"
  - id: audit
    desc: "Listing-copy audit flow: /audit, token-gated, quota by tier (§13.9)"
  - id: team
    desc: "Team-tier org: invite, accept, seat cap, member /account access"
  - id: api_access
    desc: "REST API + API keys: create, use, revoke, tier-gate (Team only)"
  - id: billing
    desc: "Customer Portal: cancel, upgrade, trial expiry, zero-charge cancel"

